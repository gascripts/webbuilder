<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web to App Generator (Android & iOS)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="bg-white max-w-lg w-full rounded-2xl shadow-lg p-6 md:p-8 border border-slate-100">
    <h1 class="text-2xl font-bold text-slate-800 mb-1">Web to App Generator</h1>
    <p class="text-sm text-slate-500 mb-6">แปลง URL เป็นแอปเต็มจอฟรี รองรับทั้ง Android APK และ iOS</p>

    <form id="appForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อแอปพลิเคชัน</label>
        <input type="text" id="appName" required placeholder="เช่น ร้านค้าของฉัน"
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">URL เว็บไซต์ (ต้องมี https://)</label>
        <input type="url" id="appUrl" required placeholder="https://example.com"
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Package Name <span class="text-xs text-slate-400">(สำหรับ Android)</span></label>
        <input type="text" id="packageName" value="com.myapp.webview"
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm font-mono">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">ไอคอนแอป (PNG / JPG)</label>
        <div class="flex items-center gap-4">
          <div id="iconPreview" class="w-16 h-16 rounded-2xl bg-slate-100 border border-slate-200 flex items-center justify-center overflow-hidden shrink-0">
            <span class="text-xs text-slate-400">Preview</span>
          </div>
          <input type="file" id="appIcon" accept="image/png, image/jpeg" required
            class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>
      </div>

      <div class="pt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
        <button type="button" onclick="handleBuild('android')"
          class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow transition">
          สร้าง Android (.apk)
        </button>

        <button type="button" onclick="handleBuild('ios')"
          class="w-full py-3 px-4 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-xl shadow transition">
          สร้าง iOS (.mobileconfig)
        </button>
      </div>
    </form>

    <div id="statusBox" class="hidden mt-6 p-4 rounded-xl text-sm"></div>
  </div>

  <script>
    // นำ Web App URL จาก Google Apps Script มาใส่ตรงนี้
    const PROXY_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyNs0kOGYVckWiFefD7l61YW7e89mVxzhqfONncE5XeeNpDAf-T2JkFM5iRAvyix7-PBA/exec';

    let iconBase64 = "";
    let pollTimer = null;

    // ย่อรูปเป็น 144x144 px (JPEG 0.85) เพื่อไม่ให้ขนาด Base64 เกินลิมิต 65KB ของ GitHub API
    document.getElementById('appIcon').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (event) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement('canvas');
          canvas.width = 144;
          canvas.height = 144;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, 144, 144);
          ctx.drawImage(img, 0, 0, 144, 144);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          iconBase64 = dataUrl.split(',')[1];

          document.getElementById('iconPreview').innerHTML =
            `<img src="${dataUrl}" class="w-full h-full object-cover" alt="Icon Preview">`;
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function showStatus(message, type = 'info') {
      const box = document.getElementById('statusBox');
      box.classList.remove('hidden', 'bg-blue-50', 'text-blue-700', 'bg-emerald-50', 'text-emerald-700', 'bg-red-50', 'text-red-700');
      if (type === 'success') box.classList.add('bg-emerald-50', 'text-emerald-700');
      else if (type === 'error') box.classList.add('bg-red-50', 'text-red-700');
      else box.classList.add('bg-blue-50', 'text-blue-700');
      box.innerHTML = message;
    }

    function generateUUID() {
      return crypto.randomUUID ? crypto.randomUUID().toUpperCase() : 'XXXXXXXX-XXXX-4XXX-YXXX-XXXXXXXXXXXX'.replace(/[XY]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'X' ? r : (r & 0x3 | 0x8)).toString(16).toUpperCase();
      });
    }

    function escapeXml(unsafe) {
      return unsafe.replace(/[<>&'"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', "'": '&apos;', '"': '&quot;' }[c]));
    }

    async function handleBuild(platform) {
      const appName = document.getElementById('appName').value.trim();
      const appUrl = document.getElementById('appUrl').value.trim();
      const packageName = document.getElementById('packageName').value.trim();

      if (!appName || !appUrl || !iconBase64) {
        showStatus('กรุณากรอกชื่อแอป, URL และอัปโหลดรูปไอคอนให้ครบถ้วนครับ', 'error');
        return;
      }

      if (platform === 'ios') {
        buildIOSMobileConfig(appName, appUrl, iconBase64);
      } else {
        await triggerAndroidBuild(appName, appUrl, packageName, iconBase64);
      }
    }

    function buildIOSMobileConfig(name, url, base64Icon) {
      const uuid1 = generateUUID();
      const uuid2 = generateUUID();
      const safeName = escapeXml(name);
      const safeUrl = escapeXml(url);

      const xmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>PayloadContent</key>
  <array>
    <dict>
      <key>FullScreen</key>
      <true/>
      <key>Icon</key>
      <data>${base64Icon}</data>
      <key>IsRemovable</key>
      <true/>
      <key>Label</key>
      <string>${safeName}</string>
      <key>PayloadDescription</key>
      <string>Web Clip for ${safeName}</string>
      <key>PayloadDisplayName</key>
      <string>${safeName}</string>
      <key>PayloadIdentifier</key>
      <string>com.webclip.${uuid1}</string>
      <key>PayloadType</key>
      <string>com.apple.webClip.managed</string>
      <key>PayloadUUID</key>
      <string>${uuid1}</string>
      <key>PayloadVersion</key>
      <integer>1</integer>
      <key>Precomposed</key>
      <true/>
      <key>URL</key>
      <string>${safeUrl}</string>
    </dict>
  </array>
  <key>PayloadDisplayName</key>
  <string>${safeName}</string>
  <key>PayloadIdentifier</key>
  <string>com.profile.${uuid2}</string>
  <key>PayloadRemovalDisallowed</key>
  <false/>
  <key>PayloadType</key>
  <string>Configuration</string>
  <key>PayloadUUID</key>
  <string>${uuid2}</string>
  <key>PayloadVersion</key>
  <integer>1</integer>
</dict>
</plist>`;

      const blob = new Blob([xmlContent], { type: 'application/x-apple-aspen-config' });
      const downloadUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = downloadUrl;
      a.download = `${name.replace(/\s+/g, '_')}.mobileconfig`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(downloadUrl);

      showStatus('<strong>สร้างไฟล์ iOS สำเร็จ!</strong><br>บน iPhone: ไปที่ <em>การตั้งค่า (Settings) → ดาวน์โหลดโปรไฟล์แล้ว → กดติดตั้ง</em> ไอคอนแอปเต็มจอจะไปปรากฏที่หน้าจอโฮมทันที', 'success');
    }

    async function triggerAndroidBuild(name, url, pkg, base64Icon) {
      if (pollTimer) clearInterval(pollTimer);
      showStatus('กำลังส่งคำสั่งสร้างไฟล์ Android APK...', 'info');

      try {
        const res = await fetch(PROXY_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            app_name: name,
            app_url: url,
            package_name: pkg,
            icon_base64: base64Icon
          })
        });

        const data = await res.json();
        if (data.status !== 'success') throw new Error(data.message || 'ไม่สามารถเริ่ม Build ได้');

        startPollingRelease(data.build_id, name);
      } catch (err) {
        showStatus(`<strong>เกิดข้อผิดพลาด:</strong> ${err.message}`, 'error');
      }
    }

    function startPollingRelease(buildId, appName) {
      const startTime = Date.now();
      const maxAttempts = 36;
      let attempts = 0;

      const renderProgress = (percent, elapsedSec) => {
        showStatus(`
          <div class="space-y-2">
            <div class="flex justify-between items-center font-medium">
              <span>กำลังคอมไพล์แอป <strong>${escapeXml(appName)}</strong>...</span>
              <span class="text-xs font-mono">${elapsedSec} วิ</span>
            </div>
            <div class="w-full bg-blue-200 rounded-full h-2.5 overflow-hidden">
              <div class="bg-blue-600 h-2.5 rounded-full transition-all duration-500" style="width: ${percent}%"></div>
            </div>
            <p class="text-xs text-blue-600">รหัสงาน: <code>${buildId}</code> (ใช้เวลาประมาณ 2-4 นาที)</p>
          </div>
        `, 'info');
      };

      renderProgress(10, 0);

      pollTimer = setInterval(async () => {
        attempts++;
        const elapsedSec = Math.floor((Date.now() - startTime) / 1000);
        const fakeProgress = Math.min(90, 10 + Math.floor((elapsedSec / 180) * 80));
        renderProgress(fakeProgress, elapsedSec);

        try {
          const checkUrl = `${PROXY_ENDPOINT}?build_id=${encodeURIComponent(buildId)}`;
          const res = await fetch(checkUrl);
          const data = await res.json();

          if (data.status === 'ready' && data.download_url) {
            clearInterval(pollTimer);
            const sizeMB = (data.size / (1024 * 1024)).toFixed(2);
            showStatus(`
              <div class="space-y-3">
                <div>
                  <strong>สร้างไฟล์ Android APK สำเร็จ!</strong>
                  <p class="text-xs mt-1">ขนาดไฟล์: ${sizeMB} MB | ใช้เวลา ${elapsedSec} วินาที</p>
                </div>
                <a href="${data.download_url}"
                  class="inline-flex items-center justify-center w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg shadow transition">
                  ดาวน์โหลด ${escapeXml(data.name)}
                </a>
                <p class="text-xs text-slate-500">* ลิงก์ชั่วคราวมีอายุประมาณ 1-2 นาที</p>
              </div>
            `, 'success');
            return;
          }
        } catch (e) {}

        if (attempts >= maxAttempts) {
          clearInterval(pollTimer);
          showStatus('<strong>ใช้เวลานานกว่าปกติ</strong> กรุณาตรวจสอบสถานะในแท็บ Actions ของ GitHub Repository', 'error');
        }
      }, 10000);
    }
  </script>
</body>
</html>
