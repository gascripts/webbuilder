name: Build Android APK from URL

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build ID'
        required: true
        type: string
      app_name:
        description: 'App Name'
        required: true
        type: string
      app_url:
        description: 'Website URL'
        required: true
        type: string
      package_name:
        description: 'Package Name'
        required: true
        type: string
      icon_base64:
        description: 'App Icon Base64'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Set up Gradle 8.7 (ไม่ต้องมีไฟล์ gradlew ใน Repo)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. Inject App Config and Icon
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_URL: ${{ inputs.app_url }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          ICON_BASE64: ${{ inputs.icon_base64 }}
        run: |
          python3 - << 'EOF'
          import os, re, base64, xml.sax.saxutils as saxutils

          app_name = saxutils.escape(os.environ['APP_NAME'])
          app_url = saxutils.escape(os.environ['APP_URL'])
          package_name = os.environ['PACKAGE_NAME'].strip()
          icon_b64 = os.environ.get('ICON_BASE64', '').strip()

          # แทนที่ app_name และ app_url
          strings_path = 'app/src/main/res/values/strings.xml'
          with open(strings_path, 'r', encoding='utf-8') as f:
              content = f.read()
          content = re.sub(r'<string name="app_name">.*?</string>', f'<string name="app_name">{app_name}</string>', content)
          content = re.sub(r'<string name="app_url">.*?</string>', f'<string name="app_url">{app_url}</string>', content)
          with open(strings_path, 'w', encoding='utf-8') as f:
              f.write(content)

          # แทนที่ applicationId
          gradle_path = 'app/build.gradle'
          with open(gradle_path, 'r', encoding='utf-8') as f:
              g_content = f.read()
          g_content = re.sub(r'applicationId\s+"[^"]+"', f'applicationId "{package_name}"', g_content)
          with open(gradle_path, 'w', encoding='utf-8') as f:
              f.write(g_content)

          # สร้างไฟล์ไอคอนลง mipmap
          if icon_b64:
              img_bytes = base64.b64decode(icon_b64)
              mipmap_dirs = [
                  'app/src/main/res/mipmap-mdpi',
                  'app/src/main/res/mipmap-hdpi',
                  'app/src/main/res/mipmap-xhdpi',
                  'app/src/main/res/mipmap-xxhdpi',
                  'app/src/main/res/mipmap-xxxhdpi'
              ]
              for d in mipmap_dirs:
                  os.makedirs(d, exist_ok=True)
                  for fname in ['ic_launcher.png', 'ic_launcher_round.png']:
                      with open(os.path.join(d, fname), 'wb') as img_f:
                          img_f.write(img_bytes)
          EOF

      - name: 5. Build Release APK
        run: gradle assembleRelease

      - name: 6. Sign APK
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          keytool -genkey -v -keystore temp.keystore -alias appkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=WebApp, OU=Dev, O=WebToApp, L=TH, S=TH, C=TH"

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -V | tail -n 1)

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-aligned.apk"
          FINAL_APK="${BUILD_ID}.apk"

          $ZIPALIGN -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          $APKSIGNER sign --ks temp.keystore --ks-pass pass:123456 --key-pass pass:123456 \
            --out "$FINAL_APK" "$ALIGNED_APK"

      - name: 7. Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.build_id }}
          name: "App Build: ${{ inputs.app_name }} (${{ inputs.build_id }})"
          body: |
            - **App Name:** ${{ inputs.app_name }}
            - **URL:** ${{ inputs.app_url }}
            - **Package:** `${{ inputs.package_name }}`
          files: ${{ inputs.build_id }}.apk
